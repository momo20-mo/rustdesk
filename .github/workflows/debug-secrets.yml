name: Debug Android Secrets

on:
  workflow_dispatch:

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    # 【关键修改】在这里将 secrets 映射为 job 级别的 env 变量
    env:
      DIAG_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      DIAG_ALIAS: ${{ secrets.ANDROID_ALIAS }}
      DIAG_STORE_PASS: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
      DIAG_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
      
    steps:
      - name: Check if Secrets are loaded
        run: |
          echo "=========================================="
          echo "🔍 Starting Secrets Diagnosis..."
          echo "=========================================="

          # 1. 检查 ANDROID_SIGNING_KEY (使用上面定义的 DIAG_KEY)
          if [ -z "$DIAG_KEY" ]; then
            echo "❌ FAIL: ANDROID_SIGNING_KEY is EMPTY or NOT SET."
          else
            # 现在可以正常使用 ${#VAR} 获取长度了
            KEY_LEN=${#DIAG_KEY}
            # 截取前20个字符用于验证（注意：GitHub 可能会在日志中自动屏蔽长字符串）
            KEY_START=$(echo "$DIAG_KEY" | head -c 20)
            echo "✅ PASS: ANDROID_SIGNING_KEY is detected."
            echo "   - Length: $KEY_LEN characters"
            echo "   - Starts with: ${KEY_START}..."
          fi

          # 2. 检查 ANDROID_ALIAS
          if [ -z "$DIAG_ALIAS" ]; then
            echo " FAIL: ANDROID_ALIAS is EMPTY or NOT SET."
          else
            echo "✅ PASS: ANDROID_ALIAS is detected."
            echo "   - Value: $DIAG_ALIAS"
          fi

          # 3. 检查密码
          if [ -z "$DIAG_STORE_PASS" ]; then
            echo "❌ FAIL: ANDROID_KEY_STORE_PASSWORD is EMPTY or NOT SET."
          else
            echo "✅ PASS: ANDROID_KEY_STORE_PASSWORD is detected."
            echo "   - Length: ${#DIAG_STORE_PASS} characters"
          fi

          if [ -z "$DIAG_KEY_PASS" ]; then
            echo "❌ FAIL: ANDROID_KEY_PASSWORD is EMPTY or NOT SET."
          else
            echo "✅ PASS: ANDROID_KEY_PASSWORD is detected."
            echo "   - Length: ${#DIAG_KEY_PASS} characters"
          fi

          echo "=========================================="
          echo "💡 Tip: If any show 'FAIL', check Settings > Secrets and variables > Actions"
          echo "=========================================="