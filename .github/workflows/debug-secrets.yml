name: Debug Android Secrets

on:
  workflow_dispatch: # 允许手动触发

jobs:
  check-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check if Secrets are loaded
        run: |
          echo "=========================================="
          echo "🔍 Starting Secrets Diagnosis..."
          echo "=========================================="

          # 1. 检查 ANDROID_SIGNING_KEY
          if [ -z "${{ secrets.ANDROID_SIGNING_KEY }}" ]; then
            echo "❌ FAIL: ANDROID_SIGNING_KEY is EMPTY or NOT SET."
          else
            KEY_LEN=${#secrets.ANDROID_SIGNING_KEY}
            KEY_START=$(echo "${{ secrets.ANDROID_SIGNING_KEY }}" | head -c 20)
            echo "✅ PASS: ANDROID_SIGNING_KEY is detected."
            echo "   - Length: $KEY_LEN characters"
            echo "   - Starts with: ${KEY_START}..."
          fi

          # 2. 检查 ANDROID_ALIAS
          if [ -z "${{ secrets.ANDROID_ALIAS }}" ]; then
            echo "❌ FAIL: ANDROID_ALIAS is EMPTY or NOT SET."
          else
            echo "✅ PASS: ANDROID_ALIAS is detected."
            echo "   - Value: ${{ secrets.ANDROID_ALIAS }}"
          fi

          # 3. 检查 ANDROID_KEY_STORE_PASSWORD
          if [ -z "${{ secrets.ANDROID_KEY_STORE_PASSWORD }}" ]; then
            echo "❌ FAIL: ANDROID_KEY_STORE_PASSWORD is EMPTY or NOT SET."
          else
            echo "✅ PASS: ANDROID_KEY_STORE_PASSWORD is detected."
            echo "   - Length: ${#secrets.ANDROID_KEY_STORE_PASSWORD} characters"
          fi

          # 4. 检查 ANDROID_KEY_PASSWORD
          if [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ]; then
            echo "❌ FAIL: ANDROID_KEY_PASSWORD is EMPTY or NOT SET."
          else
            echo "✅ PASS: ANDROID_KEY_PASSWORD is detected."
            echo "   - Length: ${#secrets.ANDROID_KEY_PASSWORD} characters"
          fi

          echo "=========================================="
          echo "💡 Tip: If any show 'FAIL', go to Settings > Secrets and variables > Actions to fix them."
          echo "=========================================="